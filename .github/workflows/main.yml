name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      uid_gid: ${{ steps.get-user.outputs.uid_gid }}
    steps:
      - id: get-user
        run: echo "uid_gid=$(id -u):$(id -g)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install deps
        run: |
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 10
          make deps
          pip install "conan<2.0"
      - run: cmake -DCMAKE_BUILD_TYPE=Debug . && make
      - run: GTEST_COLOR=1 ASAN_OPTIONS=detect_leaks=0 ctest -VV

  build_only_rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install deps
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: rustfmt
        run: |
          cd ./app/rust
          cargo fmt --version
          cargo fmt -- --check
      - name: clippy
        run: |
          cd ./app/rust
          cargo clippy --version
          cargo clippy --all-features --all-targets || true
#      - name: audit
#        run: |
#          cd ./app/rust
#          cargo audit --version
#          cargo audit
      - name: run tests
        run: |
          cd ./app/rust
          cargo test

  build_ledger:
    needs: configure
    runs-on: ubuntu-latest
    container:
      image: zondax/builder-bolos:latest
      options: --user ${{ needs.configure.outputs.uid_gid }} -e BIN_DIR=bin 
    env:
      BOLOS_SDK: ${{ github.workspace }}/deps/nanos-secure-sdk
      BOLOS_ENV: /opt/bolos
      HOME: /home/zondax_circle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build Standard app
        shell: bash -l {0}
        run: |
          source $HOME/.cargo/env
          make
      - name: Build SR25519 app
        shell: bash -l {0}
        run: |
          source $HOME/.cargo/env
          SUPPORT_SR25519=1 make

  test_zemu:
    runs-on: ubuntu-latest
    name: test_zemu (${{ matrix.variant.name }})
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: standard
            support_sr25519: ""
            make_target: ""
            test_cmd: "test"
          - name: sr25519
            support_sr25519: "SUPPORT_SR25519=1"
            make_target: buildS
            test_cmd: "testSR25519"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y libusb-1.0.0 libudev-dev

      # Node 14 required for this project (Legacy Neon 0.10)
      - name: Install node
        uses: actions/setup-node@v3
        with:
          node-version: '14.x'

      # Rust 1.65 required for compatibility with Neon 0.10
      # (Newer versions break the native module build)
      - name: Install rust
        uses: dtolnay/rust-toolchain@1.65.0

      - name: Build Ledger app
        run: |
          SUBSTRATE_PARSER_FULL=1 ${{ matrix.variant.support_sr25519 }} make ${{ matrix.variant.make_target }}

      # Critical FIX: npm 8 contains a node-gyp compatible with Python 3
      # Essential on recent Ubuntu runners with Node 14
      - name: Update npm to fix node-gyp python3 compatibility
        run: npm install -g npm@8

      - name: Install JS deps
        run: |
          make zemu_install

      # EXPLICIT REBUILD: We force a clean recompilation of the native module
      # for the exact runner environment, overwriting what 'make zemu_install' did.
      - name: Rebuild neon module
        working-directory: tests_tools/neon
        run: |
          # 1. Install JS dependencies
          yarn install
          # 2. MANUAL CLEANUP: We remove the existing binary to force recreation
          rm -rf native/index.node target/
          # 3. We run the exact build command indicated in your package.json
          ./node_modules/.bin/neon build

      - name: Run zemu tests
        working-directory: tests_zemu
        run: |
          # --env=node : To support old native modules (no jsdom)
          # --runInBand : To avoid multi-process loading issues
          # --no-cache : To ensure using the binary we just compiled
          yarn ${{ matrix.variant.test_cmd }} --env=node --runInBand --no-cache

      - name: Upload snapshots
        if: always() && github.event.inputs.generate_snapshots == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.variant.name }}
          path: tests_zemu/snapshots-tmp

  build_package:
    needs: [ configure, build, build_ledger, test_zemu ]
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    name: build_package (${{ matrix.package.name }})
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: nanos_light
            sdk: nanos-secure-sdk
            parser_full: 0
            installer_src: installer_s.sh
            installer_dest: installer_nanos_light.sh
          - name: nanos_xl
            sdk: nanos-secure-sdk
            parser_full: 1
            installer_src: installer_s.sh
            installer_dest: installer_nanos_xl.sh
          - name: nanosp_xl
            sdk: nanosplus-secure-sdk
            parser_full: 1
            installer_src: installer_s2.sh
            installer_dest: installer_nanosp_xl.sh
    container:
      image: zondax/builder-bolos:latest
      options: --user ${{ needs.configure.outputs.uid_gid }}
    env:
      BOLOS_SDK: ${{ github.workspace }}/deps/${{ matrix.package.sdk }}
      BOLOS_ENV: /opt/bolos
      HOME: /home/zondax_circle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install deps
        run: pip install ledgerblue

      - name: Build ${{ matrix.package.name }}
        shell: bash -l {0}
        run: |
          source $HOME/.cargo/env
          make SUBSTRATE_PARSER_FULL=${{ matrix.package.parser_full }}
          mv ./app/pkg/${{ matrix.package.installer_src }} ./app/pkg/${{ matrix.package.installer_dest }}
      - name: Set tag
        id: tag
        run: echo "tag_name=$(./app/pkg/${{ matrix.package.installer_dest }} version)" >> $GITHUB_OUTPUT
      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./app/pkg/${{ matrix.package.installer_dest }}
          tag_name: ${{ steps.tag.outputs.tag_name }}
          draft: false
          prerelease: false
